[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segimage"
version = "1.3.0"
description = "Open-source background removal & sticker cutout — rembg, GrabCut, AI auto-box, REST API and CLI"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fishstormX" }]
keywords = ["segmentation", "background-removal", "rembg", "sticker", "cutout"]
dependencies = [
  "fastapi==0.118.0",
  "uvicorn[standard]==0.37.0",
  "python-multipart==0.0.20",
  "numpy==2.2.6",
  "opencv-python-headless==4.11.0.86",
  "Pillow==11.3.0",
  "rembg==2.0.67",
  "onnxruntime==1.22.1",
  "scikit-image",
]

[project.optional-dependencies]
# AI auto-box / multi call OpenRouter; no extra Python deps beyond stdlib urllib.

[project.scripts]
segimage = "app.cli:main"

[project.urls]
Homepage = "https://github.com/fishstormX/segImage"
Demo = "https://jev.fishmaple.cn/segImage/"
Documentation = "https://jev.fishmaple.cn/segImage/api.html"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "segimage*"]
