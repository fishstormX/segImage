      <noscript><h2>Free online background remover</h2><p>Remove image backgrounds free online: cut out objects, products, food, people, pets and ID photos into transparent PNGs or stickers. Open source (rembg, MediaPipe, GrabCut, AI auto-box); uploads are never stored.</p><p>免费在线智能抠图工具：物品、商品、美食、人像、宠物、证件照一键去背景，导出透明 PNG 或贴纸。开源（rembg / MediaPipe / GrabCut / AI 框选），图片不落盘不保存。</p><p>JavaScript is required to use the tool.</p></noscript>

      <label class="m"><input type="radio" name="method" value="opencv" /><span><span data-i18n="m_cv"></span><small data-i18n="m_cv_s"></small></span></label>
    </section>

    <section class="panel opts">
